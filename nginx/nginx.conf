server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mansur.expert;

    root /opt/resume;
    index index.html;

    # Главная
    location = / {
        try_files /index.html =404;
    }

    # Кэш для статики
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|css|js|woff2?|ttf|pdf)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Базовый gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # По желанию — простые security-заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
}

server {
    listen 80;
    listen [::]:80;
    server_name ru.mansur.expert;

    root /opt/resume;
