server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # За caddy nginx видит http: абсолютный редирект /en → http://…/en/ давал
    # цепочку через http. Относительный Location остаётся на https.
    absolute_redirect off;

    # Старый адрес русской версии (был в sitemap до переезда в корень).
    location = /index.ru.html {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
