name: Build

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-production
          push: true
          tags: |
            ghcr.io/fattakhov/resume:latest
            ghcr.io/fattakhov/resume:${{ github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Roll out on vps-01
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new deploy@38.44.98.165 'sudo /usr/local/bin/deploy-app.sh resume'
